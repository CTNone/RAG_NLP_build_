# API Credentials
# Do not store real tokens in this file. Set them via environment variables
# or copy .env.example to .env for local development.
api:
  provider: "openrouter"
  huggingface:
    token: ""
    embedding_model: "intfloat/multilingual-e5-large-instruct"
  openrouter:
    token: ""
    model_id: "openrouter/owl-alpha"

# Database
db_dir: "chroma_db"

# Data Paths
data_path: "data"

# Đọc các folder Segmented ở trong các folder có bắt đầu bằng data_prefix thuộc folder data
data_prefix: "DATA_" # Prefix để tự động tìm các thư mục dữ liệu

# Test Questions and Answers Paths
test_questions_dir: "data/test_questions"
test_answers_dir: "data/test_answers"

# Model Parameters
max_new_tokens: 192
temperature: 0.2
top_p: 0.92
repetition_penalty: 1.2

# RAG Settings
retriever_k: 5

# Debug logging
debug: false

# Retrieval tuning
retriever_fetch_k: 20        # candidates to consider

# Context budget (approx by characters)
context:
  max_chars: 6000
  max_chars_per_chunk: 1500

# Prompt Template
template: |
  You are a direct answer bot. Your only job is to read the provided context and provide concise answers. Your answer must satisfy the following rules:
  - Answer in the SAME LANGUAGE as the question (English or Vietnamese)
  - Never explain your reasoning
  - Keep answers brief and focused on key information
  - If the context contains the answer, provide it directly.
  - If the context does not contain enough information to answer the question, reply EXACTLY with: "I do not have enough information from the provided context."
  - If the answer is a name, date, number, or place, just state it directly
  - Only use information provided in the context
  - Include source citations like [1], [2] when the answer uses retrieved context. If you provide an answer from the context, you MUST include at least one citation.

  Information: {context}

  Question: {question}

  Answer:
